<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${status != null ? status + ' Error' : 'Error'}">Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="container">
        <div class="mx-auto text-center" style="max-width: 540px;">
            <div class="display-1 fw-bold text-primary mb-3" th:text="${status ?: 'Error'}">404</div>
            <h1 class="h3 fw-semibold mb-3" th:text="${error ?: 'Page not found'}">Page not found</h1>
            <p class="text-secondary mb-4">
                The page you are looking for may have been moved, deleted, or is temporarily unavailable.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="/" class="btn btn-primary px-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24"
                         viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                         style="width: 1rem; height: 1rem;">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                        <path d="M5 12h14"/>
                        <path d="M5 12l6 6"/>
                        <path d="M5 12l6 -6"/>
                    </svg>
                    Back to home
                </a>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
