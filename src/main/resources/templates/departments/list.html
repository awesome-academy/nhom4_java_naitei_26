<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width. initial-scale=1" />
        <title>Departments - Public Service</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" th:href="@{/css/style.css}" />
    </head>

    <body>
        <div th:replace="~{fragments/header :: navbar}"></div>

        <div class="d-flex">
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>

            <main class="main-content flex-grow-1">
                <div class="container-fluid p-4">
                    <div
                            class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4"
                    >
                        <div>
                            <h1 class="fw-bold mb-1">Departments</h1>
                            <p class="text-muted mb-0">Danh sách cơ quan / phòng ban.</p>
                        </div>

                        <a th:href="@{/admin/departments/new}" class="btn btn-primary"
                        >Tạo mới</a>
                    </div>

                    <div
                        th:if="${sucessMessage}"
                        class="alert alert-success"
                        th:text="${sucessMessage}"
                    ></div>

                    <div class="card dashboard-card mb-4">
                        <div class="card-body">
                            <form
                                class="row g-3 alogn-items-end"
                                method="get"
                                th:action="@{/admin/departments}"
                            >
                                <div class="col-md-4 col-lg-3">
                                    <label class="form-label" for="name">Tìm theo tên</label>
                                    <input
                                        class="form-control"
                                        id="name"
                                        type="text"
                                        name="name"
                                        th:value="${keyword}"
                                        placeholder="Nhập tên phòng ban..."
                                    />
                                </div>

                                <div class="col-md-auto">
                                    <button type="submit" class="btn btn-outline-primary">
                                        Tìm kiếm
                                    </button>
                                    <a
                                        th:href="@{/admin/departments}"
                                        class="btn btn-outline-secondary ms-2"
                                        >Reset</a>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="card dashboard-card">
                        <div class="table-responsive">
                            <table class="table align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th scope="col">ID</th>
                                        <th scope="col">Tên phòng ban</th>
                                        <th scope="col">Mã</th>
                                        <th scope="col">Địa chỉ</th>
                                        <th scope="col">Trưởng phòng</th>
                                        <th scope="col" class="text-end">Hành động</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="department : ${departments.content}">
                                        <td th:text="${department.id()}"></td>
                                        <td class="fw-semibold" th:text="${department.name()}"></td>
                                        <td th:text="${department.code()}"></td>
                                        <td
                                            class="text-truncate"
                                            style="max-width: 280px"
                                            th:text="${department.address()}"
                                        ></td>
                                        <td>
                                            <span th:if="${department.leaderStaffName() != null}" th:text="${department.leaderStaffName()}"></span>
                                            <span th:if="${department.leaderStaffName() == null}" class="text-muted">Chưa có</span>
                                        </td>
                                        <td class="text-end">
                                            <div class="d-flex gap-2 justify-content-end">
                                                <a
                                                    class="btn btn-sm btn-outline-info"
                                                    th:href="@{/admin/departments/{id}(id=${department.id()})}"
                                                >
                                                    Xem
                                                </a>
                                                <a
                                                    class="btn btn-sm btn-outline-secondary"
                                                    th:href="@{/admin/departments/{id}/edit(id=${department.id()})}"
                                                >
                                                    Sửa
                                                </a>
                                                <form
                                                    method="post"
                                                    th:action="@{/admin/departments/{id}/delete(id=${department.id()})}"
                                                    onsubmit="return confirm('Xóa phòng ban này?');"
                                                >
                                                    <button
                                                        type="submit"
                                                        class="btn btn-sm btn-outline-danger"
                                                    >
                                                        Xóa
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${departments.isEmpty()}">
                                        <td colspan="6" class="text-center text-muted py-4">
                                            Không tìm thấy phòng ban nào
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <nav
                        th:if="${departments.totalPages > 1}"
                        class="mt-4"
                        aria-label="Department pagination"
                    >
                        <ul class="pagination mb-0">
                            <li
                                class="page-item"
                                th:classappend="${departments.first} ? ' disabled'"
                            >
                                <a
                                    class="page-link"
                                    th:href="@{/admin/departments(page=${departments.number - 1}, size=${departments.size}, name=${keyword})}"
                                >
                                    Previous
                                </a>
                            </li>

                            <li
                                class="page-item"
                                th:each="pageNumber : ${#numbers.sequence(0, departments.totalPages -1)}"
                                th:classappend="${pageNumber == departments.number} ? ' active'"
                            >
                                <a
                                    class="page-link"
                                    th:href="@{/admin/departments(page=${pageNumber}, size=${departments.size}, name=${keyword})}"
                                    th:text="${pageNumber + 1}"
                                >
                                </a>
                            </li>

                            <li
                                class="page-item"
                                th:classappend="${departments.last} ? ' disabled'"
                            >
                                <a
                                    class="page-link"
                                    th:href="@{/admin/departments(page=${departments.number +1}, size=${departments.size}, name=${keyword})}"
                                >
                                    Next
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </main>
        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
        </script>
    </body>
</html>
