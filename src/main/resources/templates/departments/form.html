<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width. initial-scale=1" />
        <title>Department Form - Public Service</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <link rel="stylesheet" th:href="@{/css/style.css}" />
    </head>

    <body>
        <div th:replace="~{fragments/header :: navbar}"></div>

        <div class="d-flex">
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>

            <main class="main-content flex-grow-1">
                <div class="container-fluid p-4">
                    <div class="mb-4">
                        <h1
                            class="fw-bold mb-1"
                            th:text="${mode == 'create'} ? 'Tạo phòng ban' : 'Sửa phòng ban'"></h1>
                        <p class="text-muted mb-0">Nhập thông tin cơ quan / phòng ban.</p>
                    </div>


                    <div class="card dashboard-card">
                        <div class="card-body">
                            <form
                                method="post"
                                th:object="${departmentForm}"
                                th:action="${mode == 'create'} ? @{/admin/departments} : @{/admin/departments/{id}(id=${departmentId})}">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label" for="name">Tên phòng ban</label>
                                        <input
                                            class="form-control"
                                            th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'"
                                            id="name"
                                            type="text"
                                            th:field="*{name}"
                                        />
                                        <div class="invalid-feedback" th:errors="*{name}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label" for="code">Mã phòng ban</label>
                                        <input
                                            class="form-control"
                                            th:classappend="${#fields.hasErrors('code')} ? ' is-invalid'"
                                            id="code"
                                            type="text"
                                            th:field="*{code}"
                                        />
                                        <div class="invalid-feedback" th:errors="*{code}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label" for="leaderStaffId">Trưởng phòng ban></label>
                                        <select
                                            class="form-select"
                                            th:classappend="${#fields.hasErrors('leaderStaffId')} ? ' is-invalid'"
                                            id="leaderStaffId"
                                            th:field="*{leaderStaffId}"
                                        >
                                            <option value="">-- Chọn trưởng phòng --</option>
                                            <option
                                                th:each="staff : ${staffList}"
                                                th:value="${staff.id}"
                                                th:text="${staff.name}"
                                            ></option>
                                        </select>
                                        <div
                                            class="invalid-feedback"
                                            th:errors="*{leaderStaffId}"
                                        ></div>
                                    </div>

                                    <div class="col-12">
                                        <label class="form-label" for="address">Địa chỉ</label>
                                        <textarea
                                            class="form-control"
                                            th:classappend="${#fields.hasErrors('address')} ? ' is-invalid'"
                                            id="address"
                                            rows="3"
                                            th:field="*{address}"
                                        ></textarea>
                                        <div class="invalid-feedback" th:errors="*{address}"></div>
                                    </div>
                                </div>

                                <div class="d-flex gap-2 mt-4">
                                    <button type="submit" class="btn btn-primary">Lưu</button>
                                    <a
                                        class="btn btn-outline-secondary"
                                        th:href="@{/admin/departments}"
                                    >
                                        Hủy
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
