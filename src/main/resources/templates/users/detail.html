<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Detail - Public Service</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="d-flex">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>

      <main class="main-content flex-grow-1">
        <div class="container-fluid p-4">
          <div
            class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4"
          >
            <div>
              <h1 class="fw-bold mb-1">User Detail</h1>
              <p class="text-muted mb-0" th:text="${user.email()}"></p>
            </div>

            <div class="d-flex flex-wrap gap-2">
              <a class="btn btn-outline-secondary" th:href="@{/admin/users}"
                >Return</a
              >
              <a
                class="btn btn-primary"
                th:href="@{/admin/users/{id}/edit(id=${user.displayId()})}"
                >Edit</a
              >
            </div>
          </div>

          <div
            th:if="${successMessage}"
            class="alert alert-success"
            th:text="${successMessage}"
          ></div>

          <div class="card dashboard-card">
            <div class="card-body">
              <dl class="row mb-0">
                <dt class="col-sm-3 text-muted">ID</dt>
                <dd class="col-sm-9" th:text="${user.displayId()}"></dd>

                <dt class="col-sm-3 text-muted">Name</dt>
                <dd class="col-sm-9 fw-semibold" th:text="${user.name()}"></dd>

                <dt class="col-sm-3 text-muted">Email</dt>
                <dd class="col-sm-9" th:text="${user.email()}"></dd>

                <dt class="col-sm-3 text-muted">Role</dt>
                <dd class="col-sm-9" th:text="${user.role()}"></dd>

                <dt class="col-sm-3 text-muted">Phone</dt>
                <dd class="col-sm-9" th:text="${user.phone()}"></dd>

                <dt class="col-sm-3 text-muted">Address</dt>
                <dd
                  class="col-sm-9"
                  th:text="${#strings.isEmpty(user.address())} ? 'None' : ${user.address()}"
                ></dd>

                <dt class="col-sm-3 text-muted">Status</dt>
                <dd class="col-sm-9">
                  <span
                    class="badge"
                    th:classappend="${user.status().name() == 'ACTIVE'} ? ' text-bg-success' : ' text-bg-secondary'"
                    th:text="${user.status()}"
                  >
                  </span>
                </dd>

                <dt class="col-sm-3 text-muted">Email Notifications</dt>
                <dd
                  class="col-sm-9"
                  th:text="${user.emailNotificationEnabled()} ? 'Enabled' : 'Disabled'"
                ></dd>
              </dl>
            </div>
          </div>

          <div class="card dashboard-card mt-4">
            <div class="card-body d-flex flex-wrap gap-2 justify-content-end">
              <form
                method="post"
                th:if="${user.status().name() != 'LOCKED'}"
                th:action="@{/admin/users/{id}/lock(id=${user.displayId()})}"
              >
                <button type="submit" class="btn btn-warning">
                  Lock Account
                </button>
              </form>

              <form
                method="post"
                th:action="@{/admin/users/{id}/delete(id=${user.displayId()})}"
                onsubmit="return confirm('Delete this user?');"
              >
                <button type="submit" class="btn btn-outline-danger">
                  Delete User
                </button>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
