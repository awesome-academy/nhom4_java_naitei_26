<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Chi tiết dịch vụ - Public Service</title>
        <link
                href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
                rel="stylesheet"
        />
        <link rel="stylesheet" th:href="@{/css/style.css}" />
    </head>

    <body>
        <div th:replace="~{fragments/header :: navbar}"></div>

        <div class="d-flex">
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>

            <main class="main-content flex-grow-1">
                <div class="container-fluid p-4">
                    <div
                            class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4"
                    >
                        <div>
                            <h1 class="fw-bold mb-1" th:text="${service.name()}"></h1>
                            <p class="text-muted mb-0">Mã dịch vụ: <span th:text="${service.code()}"></span></p>
                        </div>
                        <div class="d-flex gap-2">
                            <a
                                    class="btn btn-outline-secondary"
                                    th:href="@{/admin/services/{id}/edit(id=${service.id()})}"
                            >Sửa</a>
                            <a class="btn btn-outline-primary" th:href="@{/admin/services}">Quay lại</a>
                        </div>
                    </div>

                    <div
                            th:if="${successMessage}"
                            class="alert alert-success alert-dismissible fade show"
                            role="alert"
                    >
                        <span th:text="${successMessage}"></span>
                        <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="alert"
                                aria-label="Close"
                        ></button>
                    </div>

                    <div class="card dashboard-card">
                        <div class="card-body">
                            <dl class="row mb-0">
                                <dt class="col-sm-3">Mô tả</dt>
                                <dd class="col-sm-9" th:text="${service.description() ?: '--'}"></dd>

                                <dt class="col-sm-3">Lĩnh vực</dt>
                                <dd class="col-sm-9" th:text="${service.category() ?: '--'}"></dd>

                                <dt class="col-sm-3">Phòng ban phụ trách</dt>
                                <dd class="col-sm-9" th:text="${service.departmentName() ?: 'Chưa gán'}"></dd>




                                <dt class="col-sm-3">Thời gian xử lý</dt>
                                <dd class="col-sm-9">
                                    <span th:if="${service.processingTime() != null}" th:text="${service.processingTime()} + ' ngày'"></span>
                                    <span th:if="${service.processingTime() == null}">--</span>
                                </dd>

                                <dt class="col-sm-3">Lệ phí</dt>
                                <dd class="col-sm-9">
                                    <span
                                            th:if="${service.fee() != null}"
                                            th:text="${#numbers.formatDecimal(service.fee(), 0, 'COMMA', 0, 'POINT')} + ' đ'"
                                    ></span>
                                    <span th:if="${service.fee() == null}">Miễn phí</span>
                                </dd>
                            </dl>
                        </div>
                    </div>

                    <div class="mt-4">
                        <form
                                method="post"
                                th:action="@{/admin/services/{id}/delete(id=${service.id()})}"
                                onsubmit="return confirm('Xóa dịch vụ này? Hành động này không thể hoàn tác.');"
                        >
                            <button type="submit" class="btn btn-outline-danger">Xóa dịch vụ</button>
                        </form>
                    </div>
                </div>
            </main>
        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
