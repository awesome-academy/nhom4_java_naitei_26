<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Activity Logs - Public Service</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="d-flex">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content flex-grow-1">

        <div class="container-fluid p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold h3 mb-1">Activity Logs</h1>
                    <p class="text-muted mb-0">System audit and operation logs</p>
                </div>

                <div class="d-flex gap-2 align-items-center">
                    <input type="datetime-local" id="beforeDateInput" class="form-control form-control-sm">
                    <button class="btn btn-danger btn-sm text-nowrap" onclick="deleteOldLogs()">Delete Old Logs</button>
                </div>
            </div>

            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th scope="col" class="ps-3">ID</th>
                                <th scope="col">Timestamp</th>
                                <th scope="col">Action</th>
                                <th scope="col">Performed By</th>
                                <th scope="col">Description</th>
                                <th scope="col" class="text-center">Operation</th>
                            </tr>
                            </thead>
                            <tbody id="logTableBody">
                            <tr>
                                <td colspan="6" class="text-center py-4 text-muted">Loading activity logs...</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card-footer bg-white border-top-0 py-3">
                    <nav aria-label="Log pagination">
                        <ul class="pagination pagination-sm justify-content-end mb-0" id="pagination"></ul>
                    </nav>
                </div>
            </div>

        </div>

    </main>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/activity-logs.js}"></script>

</body>
</html>
