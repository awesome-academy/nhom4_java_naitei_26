<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Service Form - Public Service</title>
        <link
                href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
                rel="stylesheet"
        />
        <link rel="stylesheet" th:href="@{/css/style.css}" />
    </head>

    <body>
        <div th:replace="~{fragments/header :: navbar}"></div>

        <div class="d-flex">
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>

            <main class="main-content flex-grow-1">
                <div class="container-fluid p-4">
                    <div class="mb-4">
                        <h1
                            class="fw-bold mb-1"
                            th:text="${serviceId == null} ? 'Tạo dịch vụ' : 'Sửa dịch vụ'"></h1>
                        <p class="text-muted mb-0">Nhập thông tin dịch vụ hành chính công.</p>
                    </div>

                    <div class="card dashboard-card">
                        <div class="card-body">
                            <form
                                method="post"
                                th:object="${serviceRequest}"
                                th:action="${serviceId == null} ? @{/admin/services} : @{/admin/services/{id}(id=${serviceId})}"
                            >
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label" for="name">Tên dịch vụ</label>
                                        <input
                                            class="form-control"
                                            th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'"
                                            id="name"
                                            type="text"
                                            th:field="*{name}"
                                        />
                                        <div class="invalid-feedback" th:errors="*{name}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label" for="code">Mã dịch vụ</label>
                                        <input
                                            class="form-control"
                                            th:classappend="${#fields.hasErrors('code')} ? ' is-invalid'"
                                            id="code"
                                            type="text"
                                            th:field="*{code}"
                                        />
                                        <div class="invalid-feedback" th:errors="*{code}"></div>
                                    </div>

                                    <div class="col-12">
                                        <label class="form-label" for="description">Mô tả</label>
                                        <textarea
                                            class="form-control"
                                            th:classappend="${#fields.hasErrors('description')} ? ' is-invalid'"
                                            id="description"
                                            rows="4"
                                            th:field="*{description}"
                                        ></textarea>
                                        <div class="invalid-feedback" th:errors="*{description}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label" for="departmentId">Phòng ban phụ trách</label>
                                        <select
                                            class="form-select"
                                            th:classappend="${#fields.hasErrors('departmentId')} ? ' is-invalid'"
                                            id="departmentId"
                                            th:field="*{departmentId}"
                                        >
                                            <option value="">--Chọn phòng ban--</option>
                                            <option
                                                th:each="department : ${departments}"
                                                th:value="${department.id}"
                                                th:text="${department.name}"
                                            ></option>
                                        </select>
                                        <div
                                            class="invalid-feedback"
                                            th:errors="*{departmentId}"
                                        ></div>
                                    </div>



                                    <div class="col-md-4">
                                        <label class="form-label" for="processingTime">Thời gian xử lý (ngày)</label>
                                        <input
                                            class="form-control"
                                            th:classappend="${#fields.hasErrors('processingTime')} ? ' is-invalid'"
                                            id="processingTime"
                                            type="number"
                                            min="1"
                                            th:field="*{processingTime}"
                                        />
                                        <div class="invalid-feedback" th:errors="*{processingTime}"></div>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label" for="fee">Lệ phí</label>
                                        <input
                                            class="form-control"
                                            th:classappend="${#fields.hasErrors('fee')} ? ' is-invalid'"
                                            id="fee"
                                            type="number"
                                            step="0.01"
                                            min="0"
                                            th:field="*{fee}"
                                        />
                                        <div class="invalid-feedback" th:errors="*{fee}"></div>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label" for="category">Lĩnh vực</label>
                                        <input
                                            class="form-control"
                                            th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'"
                                            id="category"
                                            type="text"
                                            th:field="*{category}"
                                        />
                                        <div class="invalid-feedback" th:errors="*{category}"></div>
                                    </div>
                                </div>

                                <div class="d-flex gap-2 mt-4">
                                    <button type="submit" class="btn btn-primary">Lưu</button>
                                    <a
                                        class="btn btn-outline-secondary"
                                        th:href="@{/admin/services}"
                                    >
                                        Hủy
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <div th:replace="~{fragments/footer :: footer}"></div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
