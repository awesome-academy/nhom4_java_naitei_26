<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Users - Public Service</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="d-flex">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>

      <main class="main-content flex-grow-1">
        <div class="container-fluid p-4">
          <div
            class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4"
          >
            <div>
              <h1 class="fw-bold mb-1">Users</h1>
              <p class="text-muted mb-0">List of citizen and staff accounts.</p>
            </div>

            <a th:href="@{/admin/users/new}" class="btn btn-primary"
              >Create Account</a
            >
          </div>

          <div
            th:if="${successMessage}"
            class="alert alert-success"
            th:text="${successMessage}"
          ></div>

          <div class="card dashboard-card mb-4">
            <div class="card-body">
              <form
                class="row g-3 align-items-end"
                method="get"
                th:action="@{/admin/users}"
              >
                <div class="col-md-4 col-lg-3">
                  <label class="form-label" for="role">Filter by Role</label>
                  <select class="form-select" id="role" name="role">
                    <option value="">All Roles</option>
                    <option
                      th:each="role : ${roles}"
                      th:value="${role}"
                      th:text="${role}"
                      th:selected="${role == selectedRole}"
                    ></option>
                  </select>
                </div>

                <div class="col-md-auto">
                  <button type="submit" class="btn btn-outline-primary">
                    Filter
                  </button>
                  <a
                    th:href="@{/admin/users}"
                    class="btn btn-outline-secondary ms-2"
                    >Reset</a
                  >
                </div>
              </form>
            </div>
          </div>

          <div class="card dashboard-card">
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Name</th>
                    <th scope="col">Email</th>
                    <th scope="col">Role</th>
                    <th scope="col">Phone</th>
                    <th scope="col">Address</th>
                    <th scope="col">Status</th>
                    <th scope="col" class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="user : ${users.content}">
                    <td th:text="${user.displayId()}"></td>
                    <td class="fw-semibold" th:text="${user.name()}"></td>
                    <td class="fw-semibold" th:text="${user.email()}"></td>
                    <td th:text="${user.role()}"></td>
                    <td th:text="${user.phone()}"></td>
                    <td
                      class="text-truncate user-address-cell"
                      th:text="${user.address()}"
                    ></td>
                    <td>
                      <span
                        class="badge"
                        th:classappend="${user.status().name() == 'ACTIVE'} ? ' text-bg-success' : ' text-bg-secondary'"
                        th:text="${user.status()}"
                      >
                      </span>
                    </td>
                    <td class="text-end">
                      <div class="d-flex gap-2 justify-content-end">
                        <a
                          class="btn btn-sm btn-outline-primary"
                          th:href="@{/admin/users/{id}(id=${user.displayId()})}"
                        >
                          View
                        </a>
                        <a
                          class="btn btn-sm btn-outline-secondary"
                          th:href="@{/admin/users/{id}/edit(id=${user.displayId()})}"
                        >
                          Edit
                        </a>
                        <form
                          method="post"
                          th:action="@{/admin/users/{id}/delete(id=${user.displayId()})}"
                          onsubmit="return confirm('Delete this user?');"
                        >
                          <button
                            type="submit"
                            class="btn btn-sm btn-outline-danger"
                          >
                            Delete
                          </button>
                        </form>
                      </div>
                    </td>
                  </tr>
                  <tr th:if="${users.empty}">
                    <td colspan="8" class="text-center text-muted py-4">
                      No matching users found.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <nav
            th:if="${users.totalPages > 1}"
            class="mt-4"
            aria-label="User pagination"
          >
            <ul class="pagination mb-0">
              <li
                class="page-item"
                th:classappend="${users.first} ? ' disabled'"
              >
                <a
                  class="page-link"
                  th:href="@{/admin/users(page=${users.number - 1}, size=${users.size}, role=${selectedRole})}"
                >
                  Previous
                </a>
              </li>

              <li
                class="page-item"
                th:each="pageNumber : ${#numbers.sequence(0, users.totalPages - 1)}"
                th:classappend="${pageNumber == users.number} ? ' active'"
              >
                <a
                  class="page-link"
                  th:href="@{/admin/users(page=${pageNumber}, size=${users.size}, role=${selectedRole})}"
                  th:text="${pageNumber + 1}"
                >
                </a>
              </li>

              <li
                class="page-item"
                th:classappend="${users.last} ? ' disabled'"
              >
                <a
                  class="page-link"
                  th:href="@{/admin/users(page=${users.number + 1}, size=${users.size}, role=${selectedRole})}"
                >
                  Next
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
