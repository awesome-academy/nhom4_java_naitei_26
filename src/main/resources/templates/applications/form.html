<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title
      th:text="${mode == 'create'} ? 'Tạo hồ sơ mới - Public Service' : 'Chỉnh sửa hồ sơ - Public Service'"
    >
      Hồ sơ - Public Service
    </title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="d-flex">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>

      <main class="main-content flex-grow-1">
        <div class="container-fluid p-4">
          <!-- Breadcrumbs -->
          <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
              <li class="breadcrumb-item">
                <a th:href="@{/admin/applications}" class="text-decoration-none"
                  >Hồ sơ</a
                >
              </li>
              <li
                class="breadcrumb-item active"
                aria-current="page"
                th:text="${mode == 'create' ? 'Tạo mới' : 'Chỉnh sửa ' + applicationCode}"
              >
                Tạo mới
              </li>
            </ol>
          </nav>

          <div class="mb-4">
            <h1
              class="fw-bold mb-1"
              th:text="${mode == 'create' ? 'Tạo hồ sơ dịch vụ mới' : 'Chỉnh sửa hồ sơ: ' + applicationCode}"
            >
              Tạo hồ sơ
            </h1>
            <p class="text-muted mb-0">
              Điền thông tin chi tiết để tạo mới hoặc cập nhật hồ sơ dịch vụ
              công.
            </p>
          </div>

          <div class="card dashboard-card">
            <div class="card-body p-4">
              <form
                method="post"
                th:object="${applicationForm}"
                th:action="${mode == 'create'} ? @{/admin/applications} : @{/admin/applications/{id}(id=${applicationId})}"
              >
                <!-- Global form errors -->
                <div
                  th:if="${#fields.hasGlobalErrors()}"
                  class="alert alert-danger mb-4"
                >
                  <div
                    th:each="err : ${#fields.globalErrors()}"
                    th:text="${err}"
                  ></div>
                </div>

                <div class="row g-3">
                  <!-- Citizen Selection -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold" for="citizenId">
                      Công dân nộp hồ sơ <span class="text-danger">*</span>
                    </label>
                    <select
                      class="form-select"
                      id="citizenId"
                      th:field="*{citizenId}"
                      th:classappend="${#fields.hasErrors('citizenId')} ? ' is-invalid'"
                    >
                      <option value="">-- Chọn công dân --</option>
                      <option
                        th:each="c : ${citizens}"
                        th:value="${c.id}"
                        th:text="${c.name + ' (CCCD: ' + (c.identityNumber ?: 'Chưa có') + ' - SĐT: ' + (c.phone ?: 'Chưa có') + ')'}"
                      ></option>
                    </select>
                    <div
                      class="invalid-feedback"
                      th:errors="*{citizenId}"
                    ></div>
                  </div>

                  <!-- Service Selection -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold" for="serviceId">
                      Dịch vụ công <span class="text-danger">*</span>
                    </label>
                    <select
                      class="form-select"
                      id="serviceId"
                      th:field="*{serviceId}"
                      th:classappend="${#fields.hasErrors('serviceId')} ? ' is-invalid'"
                    >
                      <option value="">-- Chọn dịch vụ --</option>
                      <option
                        th:each="s : ${services}"
                        th:value="${s.id}"
                        th:text="${s.name + ' [' + s.code + ']' + (s.fee != null ? ' - ' + #numbers.formatDecimal(s.fee, 0, 'COMMA', 0, 'POINT') + 'đ' : '')}"
                      ></option>
                    </select>
                    <div
                      class="invalid-feedback"
                      th:errors="*{serviceId}"
                    ></div>
                  </div>

                  <!-- Staff Assignment -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold" for="assignedStaffId"
                      >Cán bộ phụ trách xử lý</label
                    >
                    <select
                      class="form-select"
                      id="assignedStaffId"
                      th:field="*{assignedStaffId}"
                      th:classappend="${#fields.hasErrors('assignedStaffId')} ? ' is-invalid'"
                    >
                      <option value="">-- Chưa phân công (Để trống) --</option>
                      <option
                        th:each="st : ${staffList}"
                        th:value="${st.id}"
                        th:text="${st.name + (st.phone != null ? ' - SĐT: ' + st.phone : '')}"
                      ></option>
                    </select>
                    <div
                      class="invalid-feedback"
                      th:errors="*{assignedStaffId}"
                    ></div>
                  </div>

                  <!-- Status Selection (Edit Mode or Initial Status) -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold" for="status"
                      >Trạng thái hồ sơ</label
                    >
                    <select
                      class="form-select"
                      id="status"
                      th:field="*{status}"
                      th:classappend="${#fields.hasErrors('status')} ? ' is-invalid'"
                    >
                      <option
                        th:each="st : ${statuses}"
                        th:value="${st.name()}"
                        th:text="${st.name() == 'RECEIVED' ? 'Chờ tiếp nhận' : (st.name() == 'PROCESSING' ? 'Đang xử lý' : (st.name() == 'APPROVED' ? 'Đã phê duyệt' : 'Bị từ chối'))}"
                      ></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{status}"></div>
                  </div>

                  <!-- Application Notes / Form Details -->
                  <div class="col-12">
                    <label class="form-label fw-semibold" for="note"
                      >Nội dung / Ghi chú hồ sơ</label
                    >
                    <textarea
                      class="form-control"
                      id="note"
                      rows="3"
                      th:field="*{note}"
                      placeholder="Nhập nội dung yêu cầu, mô tả thông tin hồ sơ..."
                    ></textarea>
                  </div>

                  <!-- Result Note (For Edit Mode or Approval) -->
                  <div class="col-md-6" th:if="${mode == 'edit'}">
                    <label
                      class="form-label fw-semibold text-success"
                      for="resultNote"
                    >
                      <i class="bi bi-check-circle me-1"></i> Ghi chú kết quả
                      phê duyệt
                    </label>
                    <textarea
                      class="form-control"
                      id="resultNote"
                      rows="2"
                      th:field="*{resultNote}"
                      placeholder="Nhập kết quả xử lý nếu đã phê duyệt..."
                    ></textarea>
                  </div>

                  <!-- Rejection Reason (For Edit Mode or Rejection) -->
                  <div class="col-md-6" th:if="${mode == 'edit'}">
                    <label
                      class="form-label fw-semibold text-danger"
                      for="rejectionReason"
                    >
                      <i class="bi bi-x-circle me-1"></i> Lý do từ chối hồ sơ
                    </label>
                    <textarea
                      class="form-control"
                      id="rejectionReason"
                      rows="2"
                      th:field="*{rejectionReason}"
                      placeholder="Nhập lý do từ chối nếu không hợp lệ..."
                    ></textarea>
                  </div>
                </div>

                <hr class="my-4" />

                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save me-1"></i> Lưu hồ sơ
                  </button>
                  <a
                    class="btn btn-outline-secondary"
                    th:href="@{/admin/applications}"
                  >
                    Hủy bỏ
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
