<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title
      th:text="${mode == 'create'} ? 'Tạo hồ sơ mới - Public Service' : 'Chỉnh sửa hồ sơ - Public Service'"
    >
      Hồ sơ - Public Service
    </title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="d-flex">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>

      <main class="main-content flex-grow-1">
        <div class="container-fluid p-4">
          <!-- Breadcrumbs -->
          <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb">
              <li class="breadcrumb-item">
                <a th:href="@{/admin/applications}" class="text-decoration-none"
                  >Hồ sơ</a
                >
              </li>
              <li
                class="breadcrumb-item active"
                aria-current="page"
                th:text="${mode == 'create' ? 'Tạo mới' : 'Chỉnh sửa ' + applicationCode}"
              >
                Tạo mới
              </li>
            </ol>
          </nav>

          <div class="mb-4">
            <h1
              class="fw-bold mb-1"
              th:text="${mode == 'create' ? 'Tạo hồ sơ dịch vụ mới' : 'Chỉnh sửa hồ sơ: ' + applicationCode}"
            >
              Tạo hồ sơ
            </h1>
            <p class="text-muted mb-0">
              Điền thông tin chi tiết để tạo mới hoặc cập nhật hồ sơ dịch vụ
              công.
            </p>
          </div>

          <div class="card dashboard-card">
            <div class="card-body p-4">
              <form
                method="post"
                th:object="${applicationForm}"
                th:action="${mode == 'create'} ? @{/admin/applications} : @{/admin/applications/{id}(id=${applicationId})}"
                enctype="multipart/form-data"
              >
                <!-- Global form errors -->
                <div
                  th:if="${#fields.hasGlobalErrors()}"
                  class="alert alert-danger mb-4"
                >
                  <div
                    th:each="err : ${#fields.globalErrors()}"
                    th:text="${err}"
                  ></div>
                </div>

                <div class="row g-3">
                  <!-- Citizen Selection -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold" for="citizenId">
                      Công dân nộp hồ sơ <span class="text-danger">*</span>
                    </label>
                    <select
                      class="form-select"
                      id="citizenId"
                      th:field="*{citizenId}"
                      th:classappend="${#fields.hasErrors('citizenId')} ? ' is-invalid'"
                    >
                      <option value="">-- Chọn công dân --</option>
                      <option
                        th:each="c : ${citizens}"
                        th:value="${c.id}"
                        th:text="${c.name + ' (CCCD: ' + (c.identityNumber ?: 'Chưa có') + ' - SĐT: ' + (c.phone ?: 'Chưa có') + ')'}"
                      ></option>
                    </select>
                    <div
                      class="invalid-feedback"
                      th:errors="*{citizenId}"
                    ></div>
                  </div>

                  <!-- Service Selection -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold" for="serviceId">
                      Dịch vụ công <span class="text-danger">*</span>
                    </label>
                    <select
                      class="form-select"
                      id="serviceId"
                      th:field="*{serviceId}"
                      th:classappend="${#fields.hasErrors('serviceId')} ? ' is-invalid'"
                    >
                      <option value="">-- Chọn dịch vụ --</option>
                      <option
                        th:each="s : ${services}"
                        th:value="${s.id}"
                        th:text="${s.name + ' [' + s.code + ']' + (s.fee != null ? ' - ' + #numbers.formatDecimal(s.fee, 0, 'COMMA', 0, 'POINT') + 'đ' : '')}"
                      ></option>
                    </select>
                    <div
                      class="invalid-feedback"
                      th:errors="*{serviceId}"
                    ></div>
                  </div>

                  <!-- Staff Assignment (loaded via AJAX) -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold" for="assignedStaffId"
                      >Cán bộ phụ trách xử lý</label
                    >
                    <select
                      class="form-select"
                      id="assignedStaffId"
                      th:field="*{assignedStaffId}"
                      th:classappend="${#fields.hasErrors('assignedStaffId')} ? ' is-invalid'"
                    >
                      <option value="">-- Chọn dịch vụ trước --</option>
                    </select>
                    <small class="text-muted">Danh sách cán bộ sẽ tải theo phòng ban phụ trách dịch vụ đã chọn.</small>
                    <div
                      class="invalid-feedback"
                      th:errors="*{assignedStaffId}"
                    ></div>
                  </div>

                  <!-- Status Selection (Edit Mode or Initial Status) -->
                  <div class="col-md-6">
                    <label class="form-label fw-semibold" for="status"
                      >Trạng thái hồ sơ</label
                    >
                    <select
                      class="form-select"
                      id="status"
                      th:field="*{status}"
                      th:classappend="${#fields.hasErrors('status')} ? ' is-invalid'"
                    >
                      <option
                        th:each="st : ${statuses}"
                        th:value="${st.name()}"
                        th:text="${st.name() == 'RECEIVED' ? 'Chờ tiếp nhận' : (st.name() == 'PROCESSING' ? 'Đang xử lý' : (st.name() == 'APPROVED' ? 'Đã phê duyệt' : 'Bị từ chối'))}"
                      ></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{status}"></div>
                  </div>

                  <!-- Application Notes / Form Details -->
                  <div class="col-12">
                    <label class="form-label fw-semibold" for="note"
                      >Nội dung / Ghi chú hồ sơ</label
                    >
                    <textarea
                      class="form-control"
                      id="note"
                      rows="3"
                      th:field="*{note}"
                      placeholder="Nhập nội dung yêu cầu, mô tả thông tin hồ sơ..."
                    ></textarea>
                  </div>

                  <!-- Result Note (Only when status = APPROVED) -->
                  <div class="col-md-6" id="resultNoteGroup" style="display: none;">
                    <label
                      class="form-label fw-semibold text-success"
                      for="resultNote"
                    >
                      <i class="bi bi-check-circle me-1"></i> Ghi chú kết quả
                      phê duyệt
                    </label>
                    <textarea
                      class="form-control"
                      id="resultNote"
                      rows="2"
                      th:field="*{resultNote}"
                      placeholder="Nhập kết quả xử lý nếu đã phê duyệt..."
                    ></textarea>
                  </div>

                  <!-- Rejection Reason (Only when status = REJECTED) -->
                  <div class="col-md-6" id="rejectionReasonGroup" style="display: none;">
                    <label
                      class="form-label fw-semibold text-danger"
                      for="rejectionReason"
                    >
                      <i class="bi bi-x-circle me-1"></i> Lý do từ chối hồ sơ
                    </label>
                    <textarea
                      class="form-control"
                      id="rejectionReason"
                      rows="2"
                      th:field="*{rejectionReason}"
                      placeholder="Nhập lý do từ chối nếu không hợp lệ..."
                    ></textarea>
                  </div>

                  <!-- Document Upload -->
                  <div class="col-12">
                    <label class="form-label fw-semibold" for="documentFile">
                      <i class="bi bi-paperclip me-1"></i> Tài liệu đính kèm
                    </label>
                    <input
                      class="form-control"
                      type="file"
                      id="documentFile"
                      name="documentFile"
                    />
                    <small class="text-muted">Chọn tệp để đính kèm vào hồ sơ (PDF, DOC, hình ảnh...).</small>
                  </div>

                  <!-- Existing documents (Edit Mode) -->
                  <div class="col-12" th:if="${mode == 'edit' && documents != null && !documents.empty}">
                    <label class="form-label fw-semibold">Tài liệu hiện có</label>
                    <div class="list-group">
                      <div
                        th:each="doc : ${documents}"
                        class="list-group-item d-flex justify-content-between align-items-center"
                      >
                        <div>
                          <i class="bi bi-file-earmark me-1"></i>
                          <span th:text="${doc.fileName}">file.pdf</span>
                          <small class="text-muted ms-2" th:text="${'(' + doc.documentType + ')'}"></small>
                        </div>
                        <a
                          th:if="${doc.fileUrl}"
                          th:href="${doc.fileUrl}"
                          target="_blank"
                          class="btn btn-sm btn-outline-primary"
                        >
                          <i class="bi bi-download me-1"></i> Tải về
                        </a>
                      </div>
                    </div>
                  </div>
                </div>

                <hr class="my-4" />

                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save me-1"></i> Lưu hồ sơ
                  </button>
                  <a
                    class="btn btn-outline-secondary"
                    th:href="@{/admin/applications}"
                  >
                    Hủy bỏ
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script th:inline="javascript">
      document.addEventListener('DOMContentLoaded', function () {
        const serviceSelect = document.getElementById('serviceId');
        const staffSelect = document.getElementById('assignedStaffId');
        const statusSelect = document.getElementById('status');
        const resultNoteGroup = document.getElementById('resultNoteGroup');
        const rejectionReasonGroup = document.getElementById('rejectionReasonGroup');

        // Lưu giá trị staff đã chọn trước đó (cho edit mode)
        const previousStaffId = /*[[${applicationForm.assignedStaffId}]]*/ null;

        // --- AJAX: Load staff theo dịch vụ ---
        function loadStaffByService(serviceId, selectedStaffId) {
          staffSelect.innerHTML = '<option value="">-- Đang tải... --</option>';
          if (!serviceId) {
            staffSelect.innerHTML = '<option value="">-- Chọn dịch vụ trước --</option>';
            return;
          }
          fetch('/admin/applications/api/services/' + serviceId + '/staff')
            .then(function(response) { return response.json(); })
            .then(function(data) {
              staffSelect.innerHTML = '<option value="">-- Chưa phân công (Để trống) --</option>';
              data.forEach(function(s) {
                var opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = s.name + (s.phone ? ' - SĐT: ' + s.phone : '');
                if (selectedStaffId && s.id == selectedStaffId) {
                  opt.selected = true;
                }
                staffSelect.appendChild(opt);
              });
            })
            .catch(function() {
              staffSelect.innerHTML = '<option value="">-- Lỗi tải danh sách --</option>';
            });
        }

        serviceSelect.addEventListener('change', function () {
          loadStaffByService(this.value, null);
        });

        // Load staff khi trang mở (cho edit mode hoặc khi đã chọn dịch vụ)
        if (serviceSelect.value) {
          loadStaffByService(serviceSelect.value, previousStaffId);
        }

        // --- Show/Hide resultNote & rejectionReason theo status ---
        function toggleStatusFields() {
          var status = statusSelect.value;
          resultNoteGroup.style.display = (status === 'APPROVED') ? '' : 'none';
          rejectionReasonGroup.style.display = (status === 'REJECTED') ? '' : 'none';
        }

        statusSelect.addEventListener('change', toggleStatusFields);
        toggleStatusFields(); // Chạy lần đầu
      });
    </script>
  </body>
</html>
