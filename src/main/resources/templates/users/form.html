<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Form - Public Service</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="d-flex">
      <div th:replace="~{fragments/sidebar :: sidebar}"></div>

      <main class="main-content flex-grow-1">
        <div class="container-fluid p-4">
          <div class="mb-4">
            <h1
              class="fw-bold mb-1"
              th:text="${mode == 'create'} ? 'Create Account' : 'Edit User'"
            ></h1>
            <p class="text-muted mb-0">
              Update account information and citizen/staff profile.
            </p>
          </div>

          <div class="card dashboard-card">
            <div class="card-body">
              <form
                method="post"
                th:object="${userForm}"
                th:action="${mode == 'create'} ? @{/admin/users} : @{/admin/users/{id}(id=${userDisplayId})}"
              >
                <div
                  class="alert alert-danger"
                  th:if="${globalError != null}"
                  th:text="${globalError}"
                ></div>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label" for="name">Name</label>
                    <input
                      class="form-control"
                      th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'"
                      id="name"
                      type="text"
                      th:field="*{name}"
                    />
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label" for="email">Email</label>
                    <input
                      class="form-control"
                      th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"
                      id="email"
                      type="email"
                      th:field="*{email}"
                    />
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label" for="password">Password</label>
                    <input
                      class="form-control"
                      th:classappend="${#fields.hasErrors('password')} ? ' is-invalid'"
                      id="password"
                      type="password"
                      th:field="*{password}"
                    />
                    <div class="form-text" th:if="${mode == 'edit'}">
                      Leave blank if you don't want to change the password.
                    </div>
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label" for="role">Role</label>
                    <select
                      class="form-select"
                      th:classappend="${#fields.hasErrors('role')} ? ' is-invalid'"
                      id="role"
                      th:field="*{role}"
                    >
                      <option value="">Select a role</option>
                      <option
                        th:each="role : ${roles}"
                        th:value="${role}"
                        th:text="${role}"
                      ></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{role}"></div>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label" for="status">Status</label>
                    <select
                      class="form-select"
                      th:classappend="${#fields.hasErrors('status')} ? ' is-invalid'"
                      id="status"
                      th:field="*{status}"
                    >
                      <option
                        th:each="status : ${statuses}"
                        th:value="${status}"
                        th:text="${status}"
                      ></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{status}"></div>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label" for="phone">Phone</label>
                    <input
                      class="form-control"
                      th:classappend="${#fields.hasErrors('phone')} ? ' is-invalid'"
                      id="phone"
                      type="text"
                      th:field="*{phone}"
                    />
                    <div class="invalid-feedback" th:errors="*{phone}"></div>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label" for="dateOfBirth"
                      >Date of birth</label
                    >
                    <input
                      class="form-control"
                      th:classappend="${#fields.hasErrors('dateOfBirth')} ? ' is-invalid'"
                      id="dateOfBirth"
                      type="date"
                      th:field="*{dateOfBirth}"
                    />
                    <div
                      class="invalid-feedback"
                      th:errors="*{dateOfBirth}"
                    ></div>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label" for="gender">Gender</label>
                    <select
                      class="form-select"
                      th:classappend="${#fields.hasErrors('gender')} ? ' is-invalid'"
                      id="gender"
                      th:field="*{gender}"
                    >
                      <option value="">Select gender</option>
                      <option value="MALE">Male</option>
                      <option value="FEMALE">Female</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{gender}"></div>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label" for="identityNumber"
                      >Identity number</label
                    >
                    <input
                      class="form-control"
                      th:classappend="${#fields.hasErrors('identityNumber')} ? ' is-invalid'"
                      id="identityNumber"
                      type="text"
                      inputmode="numeric"
                      maxlength="12"
                      placeholder="012345678901"
                      th:field="*{identityNumber}"
                      th:readonly="${mode == 'edit'}"
                    />
                    <div class="form-text">
                      Enter exactly 9 or 12 digits, for example:
                      <strong>012345678901</strong>. Do not include spaces or
                      symbols.
                    </div>
                    <div class="form-text" th:if="${mode == 'edit'}">
                      Identity number cannot be changed.
                    </div>
                    <div
                      class="invalid-feedback"
                      th:errors="*{identityNumber}"
                    ></div>
                  </div>

                  <div class="col-12">
                    <label class="form-label" for="address">Address</label>
                    <textarea
                      class="form-control"
                      th:classappend="${#fields.hasErrors('address')} ? ' is-invalid'"
                      id="address"
                      rows="3"
                      th:field="*{address}"
                    ></textarea>
                    <div class="invalid-feedback" th:errors="*{address}"></div>
                  </div>

                  <div class="col-12">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        id="emailNotificationEnabled"
                        type="checkbox"
                        th:field="*{emailNotificationEnabled}"
                      />
                      <label
                        class="form-check-label"
                        for="emailNotificationEnabled"
                      >
                        Enable Email Notifications
                      </label>
                    </div>
                  </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                  <button type="submit" class="btn btn-primary">Save</button>
                  <a
                    class="btn btn-outline-secondary"
                    th:href="@{/admin/users}"
                  >
                    Cancel
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
